[project]
name = "ultrashape-1-0"
version = "0.1.0"
description = "Shared cu124 environment for UltraShape-1.0 and Hunyuan3D-2.1"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.1.1",
    "basicsr==1.4.2",
    "bpy==4.0",
    "configargparse==1.7",
    "cubvh>=0.1.2",
    "cupy-cuda12x==13.4.1",
    "deepspeed>=0.18.4",
    "diffusers==0.30.0",
    "diso==0.1.4",
    "einops==0.8.1",
    "fastapi==0.128.0",
    "flash-attn==2.8.3",
    "fsspec>=2022.11.0",
    "gputil==1.4.0",
    "gradio==5.33.0",
    "huggingface-hub==0.36.0",
    "imageio==2.36.0",
    "ipywidgets==8.1.7",
    "jaxtyping==0.3.4",
    "loguru>=0.7.3",
    "matplotlib==3.10.8",
    "ninja==1.11.1.1",
    "numpy==1.24.4",
    "omegaconf==2.3.0",
    "onnxruntime==1.23.2",
    "open3d==0.18.0",
    "opencv-python==4.10.0.84",
    "pandas==2.3.3",
    "pillow>=11,<12",
    "psutil==6.0.0",
    "pyarrow>=23.0.0",
    "pybind11==2.13.4",
    "pydantic==2.10.6",
    "pygltflib==1.16.3",
    "pymeshlab==2022.2.post3",
    "python-multipart>=0.0.21",
    "pythreejs==2.4.2",
    "pytorch-lightning==1.9.5",
    "pytorch3d>=0.7.8",
    "pyyaml==6.0.2",
    "realesrgan==0.3.0",
    "rembg==2.0.69",
    "requests>=2.32.5",
    "safetensors==0.7.0",
    "sageattention==1.0.6",
    "scikit-image==0.24.0",
    "scipy==1.14.1",
    "setuptools>=80.10.2",
    "tensorboard>=2.20.0",
    "timm==1.0.24",
    "torch==2.5.1",
    "torch-cluster>=1.6.3",
    "torchaudio==2.5.1",
    "torchdiffeq==0.2.5",
    "torchmetrics==1.6.0",
    "torchvision==0.20.1",
    "tqdm==4.66.5",
    "transformers==4.46.0",
    "trimesh==4.4.7",
    "typeguard==4.3.0",
    "uvicorn==0.40.0",
    "wandb==0.23.1",
    "xatlas==0.0.9",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
bpy = { index = "blender" }
cubvh = { git = "https://github.com/ashawkey/cubvh.git" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.5cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "stable" }
torch-cluster = { url = "https://data.pyg.org/whl/torch-2.5.0%2Bcu124/torch_cluster-1.6.3%2Bpt25cu124-cp310-cp310-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "blender"
url = "https://download.blender.org/pypi/"
explicit = true

[tool.uv]
no-build-isolation-package = [
    "basicsr",
    "cubvh",
    "deepspeed",
    "diso",
    "facexlib",
    "gfpgan",
    "pytorch3d",
    "realesrgan",
]

[tool.uv.extra-build-dependencies]
basicsr = ["torch"]
cubvh = ["torch"]
deepspeed = ["torch"]
diso = ["torch"]
facexlib = ["torch", "torchvision"]
gfpgan = ["basicsr", "torch", "torchvision"]
pytorch3d = ["torch"]
realesrgan = ["basicsr", "torch", "torchvision"]
