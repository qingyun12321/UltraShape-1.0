    "cubvh>=0.1.2",
    "deepspeed>=0.18.4",
    "diffusers==0.30.0",
    "diso==0.1.4",
    "einops==0.8.1",
    "fastapi>=0.128.0",
    "flash-attn==2.8.3",
    "fsspec>=2022.11.0",
    "gputil==1.4.0",
    "huggingface-hub==0.36.0",
    "imageio==2.36.0",
    "ipywidgets==8.1.7",
    "jaxtyping==0.3.4",
    "loguru>=0.7.3",
    "matplotlib==3.10.8",
    "numpy==1.24.4",
    "omegaconf==2.3.0",
    "onnxruntime>=1.23.2",
    "opencv-python==4.10.0.84",
    "opencv-python-headless==4.11.0.86",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "pyarrow>=23.0.0",
    "pymeshlab==2022.2.post3",
    "python-multipart>=0.0.21",
    "pythreejs==2.4.2",
    "pytorch-lightning==1.9.5",
    "pytorch3d>=0.7.8",
    "pyyaml==6.0.2",
    "rembg>=2.0.69",
    "requests>=2.32.5",
    "safetensors==0.7.0",
    "sageattention==1.0.6",
    "scikit-image==0.24.0",
    "tensorboard>=2.20.0",
    "timm==1.0.22",
    "torch==2.5.1",
    "torch-cluster>=1.6.3",
    "torchaudio==2.5.1",
    "torchdiffeq==0.2.5",
    "torchvision==0.20.1",
    "tqdm==4.66.5",
    "transformers==4.37.2",
    "trimesh==4.4.7",
    "typeguard==4.3.0",
    "uvicorn>=0.40.0",
    "wandb==0.23.1",
